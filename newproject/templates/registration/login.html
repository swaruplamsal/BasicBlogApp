{% load static %}
<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Login</h1>
      </header>

      {% if form.errors %}
      <p class="error">Invalid username or password.</p>
      {% endif %}

      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Login</button>
      </form>

      <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
  </body>
</html>
