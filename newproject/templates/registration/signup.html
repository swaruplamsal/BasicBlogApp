{% load static %}
<!doctype html>
<html>
  <head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Sign Up</h1>
      </header>

      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Sign Up</button>
      </form>

      <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
  </body>
</html>
